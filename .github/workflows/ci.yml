name: CI

on:
  push:
  pull_request:

jobs:
  sim:
    name: Python simulator tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim/python
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sim/python/requirements.txt
      - name: Install simulator dependencies
        run: python -m pip install -r requirements.txt
      - name: Run simulator tests
        run: python -m pytest -v
      - name: Check generated vector checksums
        working-directory: .
        run: bash scripts/check-vectors.sh

  rtl:
    name: RTL smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y iverilog
      - name: Compile and run RTL placeholders
        run: bash rtl/run.sh

  verilator-lint:
    name: Optional Verilator lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y verilator
      - name: Lint DUT sources
        run: |
          verilator --lint-only -sv -Wall -Wno-fatal \
            --top-module time_serial_filter \
            rtl/common/rrc_stream_placeholder.sv rtl/time_serial/time_serial_filter.sv
          verilator --lint-only -sv -Wall -Wno-fatal \
            --top-module freq_serial_filter \
            rtl/common/rrc_stream_placeholder.sv rtl/freq_serial/freq_serial_filter.sv
          verilator --lint-only -sv -Wall -Wno-fatal \
            --top-module time_opt_filter \
            rtl/common/rrc_stream_placeholder.sv rtl/time_opt/time_opt_filter.sv
          verilator --lint-only -sv -Wall -Wno-fatal \
            --top-module freq_opt_filter \
            rtl/common/rrc_stream_placeholder.sv rtl/freq_opt/freq_opt_filter.sv
