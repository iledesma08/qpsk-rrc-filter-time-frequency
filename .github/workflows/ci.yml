name: CI

on:
  push:
  pull_request:

jobs:
  sim:
    name: Python simulator tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim/python
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sim/python/requirements.txt
      - name: Install simulator dependencies
        run: python -m pip install -r requirements.txt
      - name: Run simulator tests
        run: python -m pytest -v
      - name: Check generated vector checksums
        working-directory: .
        run: bash scripts/check-vectors.sh
